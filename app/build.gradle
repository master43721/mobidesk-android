def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}

def supabaseUrl = localProperties.getProperty('SUPABASE_URL', System.getenv('SUPABASE_URL') ?: 'https://kthfhjwltcpjhjemugwm.supabase.co')
def supabasePublishableKey = localProperties.getProperty('SUPABASE_PUBLISHABLE_KEY', System.getenv('SUPABASE_PUBLISHABLE_KEY') ?: 'sb_publishable_sXBA9ZI9HHeGqN3_SA7tWQ_5ole-HmK')

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.mobidesk.android'
    compileSdk rootProject.ext.compileApi
    buildToolsVersion rootProject.ext.toolsVersion

    defaultConfig {
        applicationId 'com.mobidesk.android'
        minSdk rootProject.ext.minApi
        targetSdk rootProject.ext.targetApi
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SUPABASE_URL', "\"${supabaseUrl}\""
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', "\"${supabasePublishableKey}\""
        buildConfigField 'String', 'AUTH_CALLBACK_SCHEME', '"com.mobidesk.android"'
        buildConfigField 'String', 'AUTH_CALLBACK_HOST', '"auth-callback"'
        buildConfigField 'String', 'AUTH_CALLBACK_URI', '"com.mobidesk.android://auth-callback"'
        buildConfigField 'String', 'AUTH_RECOVERY_URI', '"com.mobidesk.android://auth-callback/recovery"'
        ndk {
            abiFilters.addAll(rootProject.ext.abiFilters)
        }
    }

    signingConfigs {
        debug {
            storeFile file('mobidesk-ci.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

dependencies {
    implementation project(':freeRDPCore')

    implementation 'androidx.browser:browser:1.8.0'

    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation platform('io.github.jan-tennert.supabase:bom:3.6.0')
    implementation 'io.github.jan-tennert.supabase:auth-kt'
    implementation 'io.github.jan-tennert.supabase:postgrest-kt'
    implementation 'io.ktor:ktor-client-android:3.4.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
