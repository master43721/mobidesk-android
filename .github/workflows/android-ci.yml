name: Android CI

on:
  push:
    branches: [main, 'fp-*', 'fp/**', 'feature/fp-*', 'step/fp-*']
  pull_request:
    branches: [main, 'fp-*', 'fp/**', 'feature/fp-*', 'step/fp-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    name: Build and Validate Candidate APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      MOBIDESK_TARGET_ABIS: "arm64-v8a,x86_64"
    steps:
      - name: Check out source and pinned FreeRDP submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Locate preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/cmdline-tools"
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print | sort -V | tail -n 1)"
          test -x "$sdkmanager_bin"
          printf '%s\n' "$(dirname "$sdkmanager_bin")" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_bin" --version

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm

      - name: Accept Android SDK licenses and install pinned packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;4.1.2"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Cache FreeRDP native dependency archives
        uses: actions/cache@v4
        with:
          path: .freerdp-deps-cache
          key: freerdp-deps-v1-${{ hashFiles('third_party/FreeRDP/cmake/DepVersions.cmake') }}

      - name: Fetch and verify native dependencies
        shell: bash
        run: |
          python3 scripts/fetch_freerdp_deps.py --cache-dir .freerdp-deps-cache

      - name: Verify Live Drill Acceptance Gate Policy
        shell: bash
        run: |
          python3 scripts/verify_live_drill_gate.py

      - name: Run FreeRDP Pipeline & Architecture Verification
        shell: bash
        run: |
          timeout 30s python3 scripts/verify_rdp_pipeline.py || python3 scripts/verify_rdp_pipeline.py

      - name: Run JVM unit tests and assemble candidate APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 :app:testDebugUnitTest :app:assembleRelease :app:assembleDebugAndroidTest

      - name: 16KB Page-Align, Sign, and Validate Candidate APK
        shell: bash
        run: |
          set -euo pipefail
          raw_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$raw_apk"

          echo "=== Step 1: 16KB Page Alignment with zipalign ==="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -v -P 16 4 \
            "$raw_apk" \
            MobiDesk-aligned.apk

          echo "=== Step 2: V1+V2+V3 Signing with apksigner ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks app/mobidesk-ci.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out MobiDesk-v0.4.0-Stable.apk \
            MobiDesk-aligned.apk

          echo "=== Step 3: Verify 16KB Page Alignment ==="
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v -P 16 4 MobiDesk-v0.4.0-Stable.apk

          echo "=== Step 4: Verify APK Signature (V1+V2+V3) ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 21 MobiDesk-v0.4.0-Stable.apk

          echo "=== Step 5: Archive and Manifest Validation ==="
          unzip -tq MobiDesk-v0.4.0-Stable.apk
          python3 scripts/inspect_manifest.py MobiDesk-v0.4.0-Stable.apk
          sha256sum MobiDesk-v0.4.0-Stable.apk
          stat --printf='Candidate APK size: %s bytes\n' MobiDesk-v0.4.0-Stable.apk

          # Overwrite raw release APK with the 16KB-aligned and signed artifact
          cp MobiDesk-v0.4.0-Stable.apk app/build/outputs/apk/release/app-release.apk

      - name: Stage candidate APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/candidate-apks
          cp MobiDesk-v0.4.0-Stable.apk build/candidate-apks/app-release.apk
          cp MobiDesk-v0.4.0-Stable.apk build/candidate-apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk build/candidate-apks/app-debug-androidTest.apk
          ls -la build/candidate-apks/

      - name: Upload candidate APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobidesk-candidate-apks
          path: build/candidate-apks/
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK to GitHub Releases (latest-apk)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-apk
          name: "MobiDesk v0.4.0 (Latest Build)"
          files: MobiDesk-v0.4.0-Stable.apk
          overwrite_files: true

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobidesk-junit-reports-${{ github.sha }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  emulator-test:
    name: Android Emulator Installation and UI Testing
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download candidate APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mobidesk-candidate-apks
          path: candidate-apks

      - name: Locate and verify candidate APKs
        shell: bash
        run: |
          set -euo pipefail
          find candidate-apks -type f -name "app-debug.apk" -exec cp {} candidate-apks/app-debug.apk \;
          find candidate-apks -type f -name "app-debug-androidTest.apk" -exec cp {} candidate-apks/app-debug-androidTest.apk \;
          test -s candidate-apks/app-debug.apk
          test -s candidate-apks/app-debug-androidTest.apk
          sha256sum candidate-apks/*.apk

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Emulator Tests against Candidate APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/run_emulator_tests.sh

      - name: Upload Emulator Test Evidence and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobidesk-emulator-evidence-${{ github.sha }}
          path: |
            emulator-smoke.png
            emulator-after-tests.png
            emulator-logcat.txt
            instrumentation-results.txt
          if-no-files-found: ignore
          retention-days: 14
